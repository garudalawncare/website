name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish only the website. Notes, briefs and research (docs/, *.md) stay out of the live site.
      - name: Build site folder
        run: |
          mkdir _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./docs' --exclude='*.md' --exclude='./_site' -cf - . | tar -xf - -C _site

      # Minify the site script and stylesheet for faster loading. The repo keeps the
      # readable versions; if minifying fails, the readable files are published instead.
      - name: Minify JS and CSS
        run: |
          for f in garuda.js styles.css; do
            loader=""; [ "${f##*.}" = "css" ] && loader="--loader:.css=css"
            before=$(wc -c < "_site/$f")
            if npx --yes esbuild@0.23.1 "_site/$f" --minify $loader --outfile="_site/$f.min" --log-level=warning; then
              mv "_site/$f.min" "_site/$f"
              echo "minified $f: $before -> $(wc -c < "_site/$f") bytes, $(wc -l < "_site/$f") line(s)"
            else
              echo "::warning::Could not minify $f, publishing it unminified"; rm -f "_site/$f.min"
            fi
          done
          # Cache-busting: point every page at this build's version of the script and stylesheet,
          # so browsers and crawlers fetch the new files instead of a cached copy.
          v="${GITHUB_SHA::8}"
          find _site -name '*.html' -exec sed -i -E "s#(garuda\.js|styles\.css)(\?v=[A-Za-z0-9_.-]*)?\"#\1?v=${v}\"#g" {} +
          echo "asset version: $v ($(grep -l "garuda.js?v=$v" -r _site --include='*.html' | wc -l) pages)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
